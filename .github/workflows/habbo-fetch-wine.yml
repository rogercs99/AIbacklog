name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pure Wine32 AppImage dependency only
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            'https://github.com/pkgforge-dev/wine32-cli-AppImage/releases/download/11.16%402026-09-03_1788399350/wine32-cli-11.16-anylinux-x86_64.AppImage' \
            -o wine32-cli.AppImage
          test "$(stat -c %s wine32-cli.AppImage)" -eq 40040822
          sha256sum wine32-cli.AppImage > wine32-cli.AppImage.sha256
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wine32-cli-appimage
          path: |
            wine32-cli.AppImage
            wine32-cli.AppImage.sha256
          retention-days: 1

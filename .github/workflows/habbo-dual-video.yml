name: Habbo dual-client video lab
on:
  push:
    branches: [tmp-habbo-dual-video-20260921]
    paths:
      - ".github/workflows/habbo-dual-video.yml"
      - "habbo-lab/capture.sh"
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Run isolated capture lab
        run: bash habbo-lab/capture.sh
      - name: Upload real capture evidence
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: habbo-dual-video-pass6
          path: artifacts/
          if-no-files-found: error
          retention-days: 3

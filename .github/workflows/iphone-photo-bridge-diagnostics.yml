name: iPhone Photo Bridge - Diagnostics

on:
  push:
    branches: [project/iphone-photo-bridge]
    paths:
      - '.github/workflows/iphone-photo-bridge-diagnostics.yml'
      - 'iphone-photo-bridge/scripts/wg-up-macos.sh'
      - 'iphone-photo-bridge/scripts/wg-down-macos.sh'
      - 'iphone-photo-bridge/scripts/device-diagnostics.sh'
  workflow_dispatch:
    inputs:
      attempt_pair:
        description: Attempt devicectl pairing if CoreDevice sees an unpaired iPhone
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      WG_PEER_PUBLIC_KEY: P6lgCy9US7tN5XFtWmNBICPlRv7Bgy/Id1J59sstulk=
      WG_ENDPOINT: 152.114.195.138:51821
      WG_ADDRESS: 10.79.0.4/32
      WG_ALLOWED_IPS: 10.79.0.1/32,10.79.0.2/32
      VPS_OVERLAY_IP: 10.79.0.1
      IPHONE_OVERLAY_IP: 10.79.0.2
      WG_BROKER_URL: https://github-wg.gamemodai.pro
      OIDC_AUDIENCE: iphone-photo-bridge-vps
      IPHONE_DEVICE_ID: ${{ vars.IPHONE_DEVICE_ID }}
      ATTEMPT_PAIR: ${{ github.event_name == 'workflow_dispatch' && inputs.attempt_pair || false }}
    defaults:
      run:
        working-directory: iphone-photo-bridge
    steps:
      - uses: actions/checkout@v4
        with:
          ref: project/iphone-photo-bridge
      - name: Toolchain diagnostics
        working-directory: .
        run: |
          sw_vers
          xcodebuild -version
          xcrun devicectl --version || true
          route -n get default || true
      - name: Install WireGuard tools
        working-directory: .
        run: brew install wireguard-tools
      - name: Create ephemeral WireGuard peer with GitHub OIDC
        id: peer
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          WG_PRIVATE_KEY="$(wg genkey)"
          WG_PUBLIC_KEY="$(printf '%s' "$WG_PRIVATE_KEY" | wg pubkey)"
          printf '%s' "$WG_PRIVATE_KEY" > "$RUNNER_TEMP/wg-private-key"
          printf '%s' "$WG_PUBLIC_KEY" > "$RUNNER_TEMP/wg-public-key"
          chmod 600 "$RUNNER_TEMP/wg-private-key" "$RUNNER_TEMP/wg-public-key"

          token_json="$(curl --fail-with-body --silent --show-error             -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"             "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
          OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$token_json")"
          [[ -n "$OIDC_TOKEN" ]] || { echo "OIDC token response contained no value"; exit 1; }

          http="$(curl --silent --show-error -o "$RUNNER_TEMP/peer-register.json" -w '%{http_code}'             -X POST "$WG_BROKER_URL/v1/peer"             -H "Authorization: Bearer $OIDC_TOKEN"             -H 'Content-Type: application/json'             --data "$(python3 -c 'import json,sys; print(json.dumps({"public_key":sys.argv[1]}))' "$WG_PUBLIC_KEY")")"
          if [[ "$http" != 2* ]]; then
            echo "Broker rejected GitHub OIDC identity (HTTP $http)."
            python3 -c 'import json,sys; p=sys.argv[1]; d=json.load(open(p)); print("Broker error:", d.get("error") or d.get("message") or "rejected")' "$RUNNER_TEMP/peer-register.json" 2>/dev/null || echo "Broker returned a non-JSON error body."
            exit 1
          fi
          echo "OIDC_STATUS=OK" >> "$GITHUB_ENV"
          echo "PEER_STATUS=OK" >> "$GITHUB_ENV"
      - name: Bring up ephemeral WireGuard tunnel
        id: wg
        shell: bash
        run: |
          set -euo pipefail
          export WG_PRIVATE_KEY="$(cat "$RUNNER_TEMP/wg-private-key")"
          if ./scripts/wg-up-macos.sh; then
            echo "WG_STATUS=OK" >> "$GITHUB_ENV"
          else
            echo "WG_STATUS=FAIL" >> "$GITHUB_ENV"
            exit 1
          fi
      - name: Run device diagnostics
        if: always()
        shell: bash
        run: ./scripts/device-diagnostics.sh
      - name: Revoke ephemeral peer and lower tunnel
        if: always()
        shell: bash
        run: |
          set +e
          if [[ -s "$RUNNER_TEMP/wg-public-key" ]]; then
            WG_PUBLIC_KEY="$(cat "$RUNNER_TEMP/wg-public-key")"
            token_json="$(curl --fail-with-body --silent --show-error               -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN"               "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$OIDC_AUDIENCE")"
            OIDC_TOKEN="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))' <<<"$token_json")"
            if [[ -n "$OIDC_TOKEN" ]]; then
              http="$(curl --silent --show-error -o "$RUNNER_TEMP/peer-delete.json" -w '%{http_code}'                 -X DELETE "$WG_BROKER_URL/v1/peer"                 -H "Authorization: Bearer $OIDC_TOKEN"                 -H 'Content-Type: application/json'                 --data "$(python3 -c 'import json,sys; print(json.dumps({"public_key":sys.argv[1]}))' "$WG_PUBLIC_KEY")")"
              echo "Ephemeral peer cleanup HTTP $http"
            else
              echo "Cleanup OIDC token unavailable."
            fi
          fi
          ./scripts/wg-down-macos.sh || true
          rm -f "$RUNNER_TEMP/wg-private-key" "$RUNNER_TEMP/wg-public-key"

name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch modern qemu-i386 dependency only
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            'https://github.com/multiarch/qemu-user-static/releases/download/v7.2.0-1/qemu-i386-static' \
            -o qemu-i386-static
          test "$(stat -c %s qemu-i386-static)" -eq 8702448
          chmod +x qemu-i386-static
          sha256sum qemu-i386-static > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: qemu-i386-7.2
          path: |
            qemu-i386-static
            SHA256SUMS
          retention-days: 1

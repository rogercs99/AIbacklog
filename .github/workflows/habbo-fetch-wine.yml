name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official 7-Zip Linux x64 dependency only
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2             'https://github.com/ip7z/7zip/releases/download/26.03/7z2603-linux-x64.tar.xz'             -o 7z2603-linux-x64.tar.xz
          echo 'dc99eff5008f1ab79bd7084c68513701547a808a89502bf4133683535ab3c695  7z2603-linux-x64.tar.xz' | sha256sum -c -
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: sevenzip-linux-x64
          path: 7z2603-linux-x64.tar.xz
          retention-days: 1

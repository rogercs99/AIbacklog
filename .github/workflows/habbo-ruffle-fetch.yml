name: Habbo Ruffle dependency
on:
  push:
    branches:
      - lab/habbo-deps-20260922
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Fetch Ruffle Linux runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          curl -fL --retry 3 --retry-delay 2             'https://github.com/ruffle-rs/ruffle/releases/download/v0.6.0/ruffle-0.6.0-linux-x86_64.tar.gz'             -o out/ruffle-linux-x86_64.tar.gz
          tar -tzf out/ruffle-linux-x86_64.tar.gz >/dev/null
          sha256sum out/ruffle-linux-x86_64.tar.gz | tee out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: habbo-ruffle-linux
          path: out/
          if-no-files-found: error
          retention-days: 1

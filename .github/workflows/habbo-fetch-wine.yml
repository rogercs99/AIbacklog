name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Wine 10 WoW64 dependency only
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            https://github.com/Kron4ek/Wine-Builds/releases/download/10.0/wine-10.0-amd64-wow64.tar.xz \
            -o wine-10.0-amd64-wow64.tar.xz
          echo 'aeebbbf239e548f0136f1cd72a2e109dd9a572a8f703da3c09fa40d74d5c255f  wine-10.0-amd64-wow64.tar.xz' | sha256sum -c -
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wine-10-wow64
          path: wine-10.0-amd64-wow64.tar.xz
          retention-days: 1

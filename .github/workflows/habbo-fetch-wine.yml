name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch static PRoot dependency only
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            'https://github.com/proot-me/proot-static-build/releases/download/v5.1.1/proot_5.1.1_x86_64_rc2' \
            -o proot
          chmod +x proot
          file proot
          ./proot --version | head -5
          sha256sum proot > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: proot-static-x86_64
          path: |
            proot
            SHA256SUMS
          retention-days: 1

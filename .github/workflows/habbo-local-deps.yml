name: Habbo rebuild Havana Web b550
on:
  push:
    branches: [tmp-habbo-dual-video-20260921]
    paths:
      - ".github/workflows/habbo-local-deps.yml"

permissions:
  contents: read

jobs:
  build-havana-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact Havana source
        shell: bash
        run: |
          set -euxo pipefail
          git clone https://github.com/Quackster/Havana.git havana
          git -C havana checkout b550f00f27788145d26723fd19e943aa63504a63
          test "$(git -C havana rev-parse HEAD)" = "b550f00f27788145d26723fd19e943aa63504a63"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Havana Web fat JAR
        shell: bash
        run: |
          set -euxo pipefail
          cd havana
          chmod +x gradlew
          ./gradlew :Havana-Web:clean :Havana-Web:shadowJar --no-daemon
          mkdir -p ../artifact
          cp Havana-Web/build/libs/*.jar ../artifact/Havana-Web-b550.jar
          cd ..
          sha256sum artifact/Havana-Web-b550.jar | tee artifact/SHA256SUMS.txt

      - name: Upload exact web build
        uses: actions/upload-artifact@v4.6.2
        with:
          name: habbo-havana-b550-web
          path: artifact/
          retention-days: 1
          compression-level: 0

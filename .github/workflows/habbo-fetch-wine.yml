name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch exact Havana web templates and migrations only
        run: |
          set -euo pipefail
          git clone https://github.com/Quackster/Havana.git src
          cd src
          git checkout b550f00f27788145d26723fd19e943aa63504a63
          tar -czf ../havana-v1.5.4-web-support.tar.gz tools/www-tpl tools/migrations
          cd ..
          sha256sum havana-v1.5.4-web-support.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: havana-v1.5.4-web-support
          path: |
            havana-v1.5.4-web-support.tar.gz
            SHA256SUMS
          retention-days: 1

name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PRoot 5.4.0 source dependency only
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v5.4.0 --recurse-submodules https://github.com/proot-me/proot.git proot-5.4.0
          tar -C proot-5.4.0 -czf proot-5.4.0-source.tar.gz .
          sha256sum proot-5.4.0-source.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: proot-5.4.0-source
          path: |
            proot-5.4.0-source.tar.gz
            SHA256SUMS
          retention-days: 1

name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch QEMU 11.0.0 i386 user-mode dependency only
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2             'https://github.com/hermeticbuild/qemu-user-prebuilt/releases/download/11.0.0/qemu-user-linux-amd64-i386.tar.gz'             -o qemu-user-linux-amd64-i386.tar.gz
          echo 'e428f1727f04d64a01427794aef5e25a4db4a6928ee0a473951ad6545b817961  qemu-user-linux-amd64-i386.tar.gz' | sha256sum -c -
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: qemu-user-linux-amd64-i386-11.0.0
          path: qemu-user-linux-amd64-i386.tar.gz
          retention-days: 1

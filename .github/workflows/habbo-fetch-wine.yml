name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Extract tonistiigi QEMU 10.2.3 i386 binary only
        run: |
          set -euo pipefail
          docker pull tonistiigi/binfmt:qemu-v10.2.3-68
          cid="$(docker create tonistiigi/binfmt:qemu-v10.2.3-68)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/usr/bin/qemu-i386" ./qemu-i386-tonistiigi-10.2.3
          chmod +x qemu-i386-tonistiigi-10.2.3
          file qemu-i386-tonistiigi-10.2.3
          ./qemu-i386-tonistiigi-10.2.3 --version | head -3
          sha256sum qemu-i386-tonistiigi-10.2.3 > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: qemu-i386-tonistiigi-10.2.3
          path: |
            qemu-i386-tonistiigi-10.2.3
            SHA256SUMS
          retention-days: 1

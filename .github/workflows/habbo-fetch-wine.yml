name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build QEMU 10.2.3 i386 linux-user against Ubuntu glibc
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build pkg-config libglib2.0-dev libpixman-1-dev python3-venv
          git clone --depth 1 --branch v10.2.3 https://github.com/qemu/qemu.git qemu
          mkdir qemu/build
          cd qemu/build
          ../configure             --target-list=i386-linux-user             --disable-system             --disable-tools             --disable-docs             --disable-gtk             --disable-sdl             --disable-vnc             --disable-curses             --disable-slirp             --disable-guest-agent             --disable-debug-info             --disable-werror
          ninja -j2 qemu-i386
          cp qemu-i386 ../../qemu-i386-glibc-10.2.3
          cd ../..
          chmod +x qemu-i386-glibc-10.2.3
          ./qemu-i386-glibc-10.2.3 --version | head -3 | tee VERSION.txt
          file qemu-i386-glibc-10.2.3 | tee FILE.txt
          ldd qemu-i386-glibc-10.2.3 | tee LDD.txt
          sha256sum qemu-i386-glibc-10.2.3 > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: qemu-i386-glibc-10.2.3
          path: |
            qemu-i386-glibc-10.2.3
            VERSION.txt
            FILE.txt
            LDD.txt
            SHA256SUMS
          retention-days: 1

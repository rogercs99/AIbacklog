name: Habbo local assets export v07
on:
  push:
    branches: [project/habbo-2009-dual-linux-vps1-deploy-20260923]
    paths:
      - '.github/workflows/habbo-local-assets-export-v07.yml'
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch V31 assets
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/ultraviolet-jordan/habbokt.git _v31
          git -C _v31 sparse-checkout set web/src/main/resources/www/dcr/v31
          mkdir -p v31
          cp -a _v31/web/src/main/resources/www/dcr/v31/. v31/
          find v31 -type f -print0 | sort -z | xargs -0 sha256sum > v31/SHA256SUMS.txt
      - name: Fetch R39 assets
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 --filter=blob:none --sparse https://github.com/jeppe9821/HavanaR39.git _r39
          git -C _r39 sparse-checkout set tools/gamedata/flash
          mkdir -p r39
          cp -a _r39/tools/gamedata/flash/. r39/
          find r39 -type f -print0 | sort -z | xargs -0 sha256sum > r39/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: habbo-v07-v31-assets
          path: v31/
          retention-days: 7
          compression-level: 6
      - uses: actions/upload-artifact@v4
        with:
          name: habbo-v07-r39-assets
          path: r39/
          retention-days: 7
          compression-level: 6

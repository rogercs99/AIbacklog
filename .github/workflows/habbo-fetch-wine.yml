name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Tonistiigi BuildKit QEMU 10.2.3 i386 only
        run: |
          set -euo pipefail
          docker pull tonistiigi/binfmt:buildkit-v10.2.3-66
          cid="$(docker create tonistiigi/binfmt:buildkit-v10.2.3-66)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" -o rootfs.tar
          mkdir rootfs
          tar -xf rootfs.tar -C rootfs
          find rootfs -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | tee CONTENTS.txt
          q="$(find rootfs -type f -name 'buildkit-qemu-i386' | head -n1)"
          test -n "$q"
          cp "$q" ./buildkit-qemu-i386-10.2.3
          chmod +x buildkit-qemu-i386-10.2.3
          file buildkit-qemu-i386-10.2.3
          ./buildkit-qemu-i386-10.2.3 --version | head -3
          sha256sum buildkit-qemu-i386-10.2.3 > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: buildkit-qemu-i386-10.2.3
          path: |
            buildkit-qemu-i386-10.2.3
            SHA256SUMS
            CONTENTS.txt
          retention-days: 1

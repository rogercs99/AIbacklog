name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch self-contained Wine AppImage dependency only
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 2 \
            'https://github.com/pkgforge-dev/wine-AppImage/releases/download/11.16-2%402026-09-03_1788416451/wine-11.16-2-anylinux-x86_64.AppImage' \
            -o wine-anylinux.AppImage
          test "$(stat -c %s wine-anylinux.AppImage)" -eq 150671725
          sha256sum wine-anylinux.AppImage > wine-anylinux.AppImage.sha256
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: wine-anylinux-appimage
          path: |
            wine-anylinux.AppImage
            wine-anylinux.AppImage.sha256
          retention-days: 1

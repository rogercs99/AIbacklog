name: PhotoCleaner
options:
  bundleIdPrefix: com.gamemodai
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  PhotoCleaner:
    type: application
    platform: iOS
    sources:
      - PhotoCleaner/Sources/PhotoCleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gamemodai.PhotoCleaner
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        INFOPLIST_KEY_CFBundleShortVersionString: 1.0.0
        INFOPLIST_KEY_CFBundleVersion: 1
        INFOPLIST_KEY_CFBundleDisplayName: PhotoCleaner
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "PhotoCleaner analyzes your library locally to help you review duplicates and similar photos."
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: "PhotoCleaner may later let you explicitly save reviewed results."
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - PhotoCleanerTests
  PhotoCleanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PhotoCleaner/Tests/PhotoCleanerTests
    dependencies:
      - target: PhotoCleaner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.gamemodai.PhotoCleanerTests

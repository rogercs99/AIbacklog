name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch standalone talloc 2.4.4 source dependency only
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/py4n6/pytsk.git pytsk
          test -s pytsk/talloc/talloc.c
          test -s pytsk/talloc/talloc.h
          test -s pytsk/talloc/replace.h
          tar -C pytsk -czf talloc-2.4.4-standalone.tar.gz talloc
          sha256sum talloc-2.4.4-standalone.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: talloc-2.4.4-standalone
          path: |
            talloc-2.4.4-standalone.tar.gz
            SHA256SUMS
          retention-days: 1

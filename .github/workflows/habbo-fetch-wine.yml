name: Habbo dependency fetch
on:
  push:
    branches: [tmp-habbo-dependency-fetch]
    paths:
      - ".github/workflows/habbo-fetch-wine.yml"
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Tonistiigi BuildKit QEMU 10.2.3 i386 only
        run: |
          set -euo pipefail
          img='tonistiigi/binfmt:buildkit-v10.2.3-66'
          docker pull "$img"
          docker image save "$img" -o image.tar
          mkdir image rootfs
          tar -xf image.tar -C image
          python3 - <<'PY'
          import json, tarfile, pathlib
          root=pathlib.Path("image")
          manifest=json.loads((root/"manifest.json").read_text())[0]
          out=pathlib.Path("rootfs")
          for layer in manifest["Layers"]:
              with tarfile.open(root/layer) as t:
                  t.extractall(out)
          PY
          find rootfs -maxdepth 3 -type f -printf '%p %s bytes\n' | sort | tee CONTENTS.txt
          q="$(find rootfs -type f -name 'buildkit-qemu-i386' | head -n1)"
          test -n "$q"
          cp "$q" ./buildkit-qemu-i386-10.2.3
          chmod +x buildkit-qemu-i386-10.2.3
          file buildkit-qemu-i386-10.2.3
          ./buildkit-qemu-i386-10.2.3 --version | head -3
          sha256sum buildkit-qemu-i386-10.2.3 > SHA256SUMS
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: buildkit-qemu-i386-10.2.3
          path: |
            buildkit-qemu-i386-10.2.3
            SHA256SUMS
            CONTENTS.txt
          retention-days: 1

name: Habbo 2009 Dual Linux release

on:
  push:
    tags:
      - 'habbo-2009-dual-linux-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Dual-client Linux gameplay milestone completed with binary evidence for both historical clients.

          Validated:
          - R39 / Flash: fresh native Adobe Flash Linux x86_64 validation, real Havana login, TCP 12323, room 1000, avatar visible, two WALK events, before/after framebuffer and clean movement video.
          - V31 / Shockwave: PRoot filesystem-only + QEMU i386 9.2.4 + Wine32 5.11, TCP 12321, room 1000, avatar visible, two WALK paths proven by framebuffer/video.

          Preferred recovery package:
          - ChatGPT Library: /Habbo 2009 Dual Linux/habbo-2009-dual-linux-FINAL-v2-20260923.zip
          - SHA-256: f80bbefc5a486fd0f9cce058a39462ef3925c563253dc2f69ebe647f6a6630ec

          The original v1 package remains valid and immutable for historical reproducibility.
          Full validation, recovery and hashes live in habbo-linux-checkpoint/.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Habbo 2009 Dual Linux — Dual evidence bundle v2" \
            --notes-file release-notes.md

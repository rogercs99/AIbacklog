name: Habbo lab Playwright WebKit 1.57
on:
  push:
    branches: [tmp-habbo-dual-video-20260921]
    paths:
      - ".github/workflows/habbo-local-deps.yml"

permissions:
  contents: read

jobs:
  webkit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact Playwright WebKit
        shell: bash
        run: |
          set -euxo pipefail
          node --version
          npx -y playwright@1.57.0 install webkit
          test -x "$HOME/.cache/ms-playwright/webkit-2227/pw_run.sh"
          "$HOME/.cache/ms-playwright/webkit-2227/pw_run.sh" --version || true
          mkdir -p artifact
          tar -czf artifact/playwright-webkit-1.57.0-linux.tar.gz             -C "$HOME/.cache/ms-playwright" webkit-2227
          sha256sum artifact/playwright-webkit-1.57.0-linux.tar.gz > artifact/SHA256SUMS.txt
          du -h artifact/playwright-webkit-1.57.0-linux.tar.gz

      - name: Upload WebKit runtime
        uses: actions/upload-artifact@v4.6.2
        with:
          name: habbo-playwright-webkit-1.57.0
          path: artifact/
          retention-days: 1
          compression-level: 0
